yaw":-1.003476804765203,"pitch":0.9278659832537777}]},"58-physik-ausstattung-1":{"name":"Physik-ausstattung 1","file":"images/58-physik-ausstattung-1.jpg","links":[{"target":"57-phayik-ausstattung-3","yaw":1.796068928322894,"pitch":0.4589299258745232},{"target":"59-physiksaal","yaw":-1.4521676773152343,"pitch":0.5627411137811205}]},"59-physiksaal":{"name":"Physiksaal","file":"images/59-physiksaal.jpg","links":[{"target":"29-3stock-7-physiksaal","yaw":2.9199906444905643,"pitch":0.470059564609663},{"target":"58-physik-ausstattung-1","yaw":1.9152981504162323,"pitch":0.3584525021096905}]},"60-cafeteria":{"name":"Cafeteria","file":"images/60-cafeteria.jpg","links":[{"target":"63-gang-3","yaw":-1.081862908231054,"pitch":0.1922680986940115},{"target":"62-gang-2","yaw":2.7468070038184482,"pitch":0.18697606695731217}]},"61-gang-1":{"name":"Gang 1","file":"images/61-gang-1.jpg","links":[{"target":"62-gang-2","yaw":-0.06360837959993049,"pitch":0.20372187330294977},{"target":"4-erdgeschoss-3","yaw":-3.137666660767522,"pitch":0.27276546382549327}]},"62-gang-2":{"name":"Gang 2","file":"images/62-gang-2.jpg","links":[{"target":"60-cafeteria","yaw":0.08520187414737812,"pitch":0.18874377290294042},{"target":"61-gang-1","yaw":-3.0681519233871146,"pitch":0.10612790005781925}]},"63-gang-3":{"name":"Gang 3","file":"images/63-gang-3.jpg","links":[{"target":"45-keller-10","yaw":1.7688399474152883,"pitch":0.4581872141961867},{"target":"64-gang-4","yaw":0.006591711400277589,"pitch":0.19176035118892898},{"target":"60-cafeteria","yaw":2.8609941081235775,"pitch":0.24303673070207665}]},"64-gang-4":{"name":"Gang 4","file":"images/64-gang-4.jpg","links":[{"target":"51-technologieraum-erdgeschoss","yaw":0.4081074169738823,"pitch":0.22569952455320674},{"target":"63-gang-3","yaw":-2.6890631092609247,"pitch":0.28698254189573014}]}};
let currentSceneId = "0-haupteingang";

const canvas = document.getElementById("canvas");
const support = document.getElementById("support");
const sceneName = document.getElementById("sceneName");
const targets = document.getElementById("targets");
const vrStart = document.getElementById("vrStart");

const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.xr.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,1,0.1,1100);
camera.position.set(0,0,0);

const panoramaGeometry = new THREE.SphereGeometry(100,96,64);
panoramaGeometry.scale(-1,1,1);
const panoramaMaterial = new THREE.MeshBasicMaterial({color:0xffffff});
const panorama = new THREE.Mesh(panoramaGeometry, panoramaMaterial);

// Important: Three.js' equirectangular UV zero differs from the Marzipano yaw zero.
// Rotating the sphere -90° makes panorama center correspond to yaw = 0.
panorama.rotation.y = -Math.PI / 2;
scene.add(panorama);

const hotspotGroup = new THREE.Group();
scene.add(hotspotGroup);

const loader = new THREE.TextureLoader();
const textureCache = new Map();

function makeArrowTexture(color="#ffffff"){
  const c=document.createElement("canvas");
  c.width=256;c.height=256;
  const x=c.getContext("2d");
  x.clearRect(0,0,256,256);
  x.beginPath();
  x.arc(128,128,92,0,Math.PI*2);
  x.fillStyle="rgba(0,0,0,.48)";
  x.fill();
  x.lineWidth=10;
  x.strokeStyle=color;
  x.stroke();
  x.beginPath();
  x.moveTo(128,52); x.lineTo(198,132); x.lineTo(158,132);
  x.lineTo(158,194); x.lineTo(98,194); x.lineTo(98,132); x.lineTo(58,132);
  x.closePath();
  x.fillStyle=color;
  x.fill();
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const arrowTex = makeArrowTexture("#ffffff");
const arrowHoverTex = makeArrowTexture("#55ff88");
// Only arrow appearance: choose direction relative to the panorama's forward axis.
// SpriteMaterial.rotation turns the existing arrow graphic without changing its rendering.
function arrowRotation(yaw){
  const a=Math.atan2(Math.sin(yaw),Math.cos(yaw));
  if(a > Math.PI*0.75 || a < -Math.PI*0.75) return 0; // back: keep arrow pointing into hotspot, not away from it
  if(a > Math.PI*0.25) return -Math.PI/2; // right
  if(a < -Math.PI*0.25) return Math.PI/2; // left
  return 0; // forward
}


function sphericalPosition(yaw,pitch,r=7.5){
  const cp=Math.cos(pitch);
  return new THREE.Vector3(
    r*cp*Math.sin(yaw),
    r*Math.sin(pitch),
    -r*cp*Math.cos(yaw)
  );
}

function clearHotspots(){
  while(hotspotGroup.children.length) hotspotGroup.remove(hotspotGroup.children[0]);
}

function buildHotspots(){
  clearHotspots();
  const s=SCENES[currentSceneId];
  targets.textContent="Erreichbar: "+s.links.map(l=>SCENES[l.target].name).join(" · ");
  for(const link of s.links){
    const mat=new THREE.SpriteMaterial({map:arrowTex,transparent:true,depthTest:false,depthWrite:false});
    mat.rotation=arrowRotation(link.yaw);
    const sprite=new THREE.Sprite(mat);
    sprite.position.copy(sphericalPosition(link.yaw,-0.26));
    sprite.scale.set(1.15,1.15,1.15);
    sprite.userData.target=link.target;
    hotspotGroup.add(sprite);
  }
}

async function getTexture(url){
  if(textureCache.has(url)) return textureCache.get(url);
  const t=await loader.loadAsync(url);
  t.colorSpace=THREE.SRGBColorSpace;
  textureCache.set(url,t);
  return t;
}

async function switchScene(id){
  if(!SCENES[id]) return;
  currentSceneId=id;
  const s=SCENES[id];
  sceneName.textContent=s.name;
  panorama.material.map=await getTexture(s.file);
  panorama.material.needsUpdate=true;
  buildHotspots();
}

await switchScene(currentSceneId);

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize",resize); resize();

const raycaster=new THREE.Raycaster();
const tempMatrix=new THREE.Matrix4();
let hovered=null;

function setHovered(obj){
  if(hovered===obj) return;
  if(hovered) hovered.material.map=arrowTex;
  hovered=obj;
  if(hovered) hovered.material.map=arrowHoverTex;
}

function setupController(index){
  const controller=renderer.xr.getController(index);
  scene.add(controller);
  const lineGeom=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,-1)]);
  const line=new THREE.Line(lineGeom,new THREE.LineBasicMaterial({color:0x55ff88}));
  line.scale.z=8;
  controller.add(line);
  controller.addEventListener("select",()=>{
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
    const hits=raycaster.intersectObjects(hotspotGroup.children,false);
    if(hits.length) switchScene(hits[0].object.userData.target);
  });
  return controller;
}
const controllers=[setupController(0),setupController(1)];

const mouse=new THREE.Vector2();
canvas.addEventListener("pointerdown",(e)=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(hotspotGroup.children,false);
  if(hits.length) switchScene(hits[0].object.userData.target);
});

let vrButton;
if(navigator.xr){
  try{
    const ok=await navigator.xr.isSessionSupported("immersive-vr");
    if(ok){
      support.textContent="Immersive VR wird unterstützt.";
      vrStart.disabled=false;
      vrButton=VRButton.createButton(renderer,{optionalFeatures:["local-floor","bounded-floor"]});
      vrButton.style.display="none";
      document.body.appendChild(vrButton);
      vrStart.addEventListener("click",()=>vrButton.click());
    } else support.textContent="Dieser Browser meldet keine Unterstützung für immersive VR.";
  } catch(e) { support.textContent="WebXR-Prüfung fehlgeschlagen: "+e.message; }
} else support.textContent="WebXR ist in diesem Browser nicht verfügbar.";

renderer.xr.addEventListener("sessionstart",()=>document.body.classList.add("invr"));
renderer.xr.addEventListener("sessionend",()=>document.body.classList.remove("invr"));

renderer.setAnimationLoop(()=>{
  if(renderer.xr.isPresenting){
    let best=null;
    for(const controller of controllers){
      tempMatrix.identity().extractRotation(controller.matrixWorld);
      raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
      raycaster.ray.direction.set(0,0,-1).applyMatrix4(tempMatrix);
      const hits=raycaster.intersectObjects(hotspotGroup.children,false);
      if(hits.length){best=hits[0].object;break;}
    }
    setHovered(best);
  }
  renderer.render(scene,camera);
});
</script>
